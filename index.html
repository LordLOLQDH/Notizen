<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notiz-App</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #111827;
      --accent: #2563eb;
      --border: #dbe3ee;
    }
    body.dark {
      --bg: #0f172a;
      --card: #111827;
      --text: #f8fafc;
      --accent: #3b82f6;
      --border: #1e293b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; padding: 20px; }
    .container { max-width: 1200px; margin: auto; }
    .topbar { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:20px; }
    .auth,.form,.note { background:var(--card); border:1px solid var(--border); border-radius:16px; }
    .auth,.form { padding:20px; margin-bottom:20px; }
    .form { display:grid; gap:12px; }
    input,textarea,button { border-radius:10px; }
    input,textarea { width:100%; padding:12px; border:1px solid var(--border); background:var(--card); color:var(--text); }
    textarea { min-height:120px; }
    button { background:var(--accent); color:white; border:none; padding:10px 14px; cursor:pointer; }
    .notes { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:16px; }
    .note { padding:16px; }
    .actions { display:flex; gap:10px; margin-top:10px; }
    .search { margin-bottom:20px; }
    #appSection { display:none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <h1>📝 Notiz-App</h1>
      <button id="themeToggle">Dark Mode</button>
    </div>

    <div class="auth" id="authSection">
      <h2>Lokaler Login</h2><br>
      <input type="text" id="username" placeholder="Benutzername"><br><br>
      <input type="password" id="password" placeholder="Passwort"><br><br>
      <button id="loginBtn">Login / Registrieren</button>
    </div>

    <div id="appSection">
      <div class="form">
        <input type="text" id="title" placeholder="Titel" />
        <textarea id="content" placeholder="Deine Notiz..."></textarea>
        <button id="saveBtn">Notiz speichern</button>
      </div>

      <input class="search" type="text" id="search" placeholder="Notizen durchsuchen..." />
      <div class="notes" id="notes"></div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
